name: pregen-command
on:
  repository_dispatch:
    types: [pregen-command]

permissions: {}

jobs:
  pregen:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # Checkout the pull request branch
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.SCD }}
          repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
          ref: ${{ github.event.client_payload.pull_request.head.ref }}
      - uses: advantic-au/action-mq-client@stable
        id: mq-client
        with:
          client-version: latest
      - name: Install rust stable
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: "build"
      - name: Run build and refresh generated source code
        run: cargo build --no-default-features --features pregen
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
      - uses: qoomon/actions--setup-git@8e6bd30ac05e17a81b61169daae62cb6b7e61294 #v1.1
      - name: Modify pull request with refreshed pregen files
        shell: bash
        run: |
          git add libmqm-sys/src libmqm-default/src libmqm-constants/src
          git commit -m "chore: MQ client ${MQ_CLIENT_VERSION} ${{ runner.os }}" || true
          git push
        env:
          MQ_CLIENT_VERSION: ${{ steps.mq-client.outputs.client-version }}
