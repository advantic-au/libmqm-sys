name: pregen-command
on:
  repository_dispatch:
    types: [pregen-command]
jobs:
  bindgen_pregen:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout the pull request branch
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.SCD }}
          repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
          ref: ${{ github.event.client_payload.pull_request.head.ref }}
      - uses: advantic-au/action-mq-client@stable
        id: mq-client
        with:
          client-version: latest
      - name: Install stable rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
      - name: Run build and refresh bindings
        run: cargo build --no-default-features --features pregen
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
      - uses: qoomon/actions--setup-git@v1
      - name: Modify pull request with refreshed pregen files
        shell: bash
        run: |
          git add libmqm-sys/src libmqm-default/src
          git commit -m "chore: MQ client ${MQ_CLIENT_VERSION}} ${{ runner.os }}"" || true
          git push
        env:
          MQ_CLIENT_VERSION: ${{ steps.mq-client.outputs.client-version }}
