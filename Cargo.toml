[workspace]
resolver = "2"
members = [ "libmqm-constants","libmqm-default", "libmqm-sys"]

[workspace.package]
version = "0.7.0"
authors = ["Warren Spits <warren@advantic.au>"]
repository = "https://github.com/advantic-au/libmqm-sys"
license = "Apache-2.0"
readme = "README.md"
edition = "2021"
rust-version = "1.77"                                    # Note: Also change the github workflow "minimum" action

[workspace.lints.rust]
non_camel_case_types = "allow"
non_snake_case = "allow"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
